<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#090B10" />
    <title>CineBox — No Internet Connection</title>
    <script>
      (function () {
        try {
          var t = localStorage.getItem('cinebox_theme');
          if (t === 'dark' || (!t && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
          }
        } catch (e) {}
      })();
    </script>
    <style>
      :root {
        --bg: #f6f8fc;
        --card: #ffffff;
        --border: rgba(15, 23, 42, 0.1);
        --text: #0f172a;
        --muted: #475569;
        --subtle: #64748b;
        --pill-bg: #f8fafc;
        --accent: #e11d48;
        --accent-hover: #be123c;
        --icon-bg: rgba(225, 29, 72, 0.1);
      }
      html.dark {
        --bg: #090b10;
        --card: #111623;
        --border: rgba(255, 255, 255, 0.1);
        --text: #f8fafc;
        --muted: #cbd5e1;
        --subtle: #94a3b8;
        --pill-bg: rgba(255, 255, 255, 0.04);
        --icon-bg: rgba(225, 29, 72, 0.16);
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        min-height: 100dvh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 24px;
        background: var(--bg);
        color: var(--text);
        font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      .card {
        width: 100%;
        max-width: 440px;
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 20px;
        padding: 32px 26px;
        text-align: center;
        box-shadow: 0 24px 48px -18px rgba(0, 0, 0, 0.22);
      }
      .brand {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        margin-bottom: 24px;
        font-weight: 700;
        font-size: 15px;
        letter-spacing: -0.01em;
        color: var(--text);
      }
      .brand-dot {
        width: 10px;
        height: 10px;
        border-radius: 3px;
        background: var(--accent);
      }
      .icon-wrap {
        width: 64px;
        height: 64px;
        margin: 0 auto 20px;
        border-radius: 16px;
        background: var(--icon-bg);
        color: var(--accent);
        display: flex;
        align-items: center;
        justify-content: center;
      }
      h1 {
        margin: 0 0 10px;
        font-size: 22px;
        line-height: 1.25;
        font-weight: 700;
        letter-spacing: -0.02em;
      }
      p {
        margin: 0 0 22px;
        font-size: 14px;
        line-height: 1.6;
        color: var(--muted);
      }
      .tips {
        text-align: left;
        background: var(--pill-bg);
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 12px 14px;
        margin-bottom: 24px;
        font-size: 12.5px;
        line-height: 1.6;
        color: var(--subtle);
      }
      .tips div + div {
        margin-top: 4px;
      }
      button {
        width: 100%;
        appearance: none;
        border: none;
        border-radius: 12px;
        background: linear-gradient(135deg, #e11d48, #be123c);
        color: #ffffff;
        font-size: 14px;
        font-weight: 600;
        padding: 13px 18px;
        cursor: pointer;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        transition: opacity 0.15s ease, transform 0.1s ease;
      }
      button:active {
        transform: scale(0.99);
      }
      button:disabled {
        opacity: 0.7;
        cursor: wait;
      }
      .status {
        margin-top: 12px;
        min-height: 18px;
        font-size: 12px;
        color: var(--subtle);
      }
    </style>
  </head>
  <body>
    <main class="card" role="main" aria-labelledby="offline-title">
      <div class="brand">
        <span class="brand-dot" aria-hidden="true"></span>
        <span>CineBox</span>
      </div>

      <div class="icon-wrap" aria-hidden="true">
        <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 20h.01" />
          <path d="M8.5 16.429a5 5 0 0 1 7 0" />
          <path d="M5 12.859a10 10 0 0 1 5.17-2.69" />
          <path d="M19 12.859a10 10 0 0 0-2.007-1.523" />
          <path d="M2 8.82a15 15 0 0 1 4.177-2.643" />
          <path d="M22 8.82a15 15 0 0 0-11.288-3.764" />
          <path d="m2 2 20 20" />
        </svg>
      </div>

      <h1 id="offline-title">No Internet Connection</h1>
      <p>
        CineBox couldn&rsquo;t connect because your device appears to be offline or out of mobile data.
      </p>

      <div class="tips">
        <div>&bull; Turn on Wi-Fi or mobile data in your device settings.</div>
        <div>&bull; Confirm your mobile data plan still has active data.</div>
      </div>

      <button id="retry-btn" type="button">
        <span>Try Again</span>
      </button>
      <div id="status-text" class="status" aria-live="polite"></div>
    </main>

    <script>
      (function () {
        var btn = document.getElementById('retry-btn');
        var statusEl = document.getElementById('status-text');
        var busy = false;

        function checkAndReload() {
          if (busy) return;
          if (typeof navigator !== 'undefined' && navigator.onLine === false) {
            statusEl.textContent = 'Still offline. Please check your connection.';
            return;
          }
          busy = true;
          btn.disabled = true;
          statusEl.textContent = 'Checking connection...';

          var ctrl = typeof AbortController === 'function' ? new AbortController() : null;
          var timer = ctrl ? setTimeout(function () { ctrl.abort(); }, 6000) : null;

          fetch('/api/health?_t=' + Date.now(), {
            cache: 'no-store',
            signal: ctrl ? ctrl.signal : undefined
          })
            .then(function (res) {
              if (!res.ok) throw new Error('offline');
              return res.json();
            })
            .then(function (data) {
              if (data && data.ok) {
                window.location.replace('/');
                return;
              }
              throw new Error('offline');
            })
            .catch(function () {
              statusEl.textContent = 'Still unable to connect. Check Wi-Fi or mobile data.';
              btn.disabled = false;
              busy = false;
            })
            .finally(function () {
              if (timer) clearTimeout(timer);
            });
        }

        btn.addEventListener('click', checkAndReload);
        window.addEventListener('online', checkAndReload);
      })();
    </script>
  </body>
</html>
